name: GBA portable regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-and-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install portable RTL simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Run Python regression
        run: python -m unittest discover -s tests -v
      - name: Run host C regression
        run: python scripts/flow/run_host_regression.py
      - name: Run portable RTL regression
        run: python scripts/flow/run_iverilog_tests.py
      - name: Upload RTL logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-rtl-logs
          path: build/ci/iverilog/*/*.log
          if-no-files-found: ignore
