[stages.rtl_memory]
kind = "test"
needs = ["rtl_project"]
inputs = ["tests/rtl_manifest.toml", "tools/rtl_manifest.py", "tests/rtl/**", "scripts/build/run_rtl_manifest.py"]
outputs = ["out/sim/memory/seed-1/current/*/xsim.log"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/run_rtl_manifest.py", "--suite", "memory", "--seed", "1", "--jobs", "2", "--vivado", "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado"]
toolchains = ["python", "vivado"]
timeout_seconds = 7200
success_markers = ["FPGA_FLOW_RTL_PASS"]

[stages.rtl_cpu]
kind = "test"
needs = ["rtl_project"]
inputs = ["tests/rtl_manifest.toml", "tools/rtl_manifest.py", "tests/rtl/**", "scripts/build/run_rtl_manifest.py"]
outputs = ["out/sim/cpu/seed-1/current/*/xsim.log"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/run_rtl_manifest.py", "--suite", "cpu", "--seed", "1", "--jobs", "2", "--vivado", "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado"]
toolchains = ["python", "vivado"]
timeout_seconds = 7200
success_markers = ["FPGA_FLOW_RTL_PASS"]

[stages.rtl_system]
kind = "test"
needs = ["rtl_project"]
inputs = ["tests/rtl_manifest.toml", "tools/rtl_manifest.py", "tests/rtl/**", "scripts/build/run_rtl_manifest.py"]
outputs = ["out/sim/system/seed-1/current/*/xsim.log"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/run_rtl_manifest.py", "--suite", "system", "--seed", "1", "--jobs", "2", "--vivado", "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado"]
toolchains = ["python", "vivado"]
timeout_seconds = 14400
success_markers = ["FPGA_FLOW_RTL_PASS"]

[stages.deploy_jtag]
kind = "deploy"
needs = ["hardware", "platform", "app", "boot"]
target = "zybo_z7_20"
toolchains = ["xsct"]
runner = "amd.zynq.jtag"
destructive = true
timeout_seconds = 180
description = "联合复位、配置 PL、初始化 PS 并下载 app"
options = { bitstream = "out/current/bitstream.bit", ps_init_script = "out/current/ps7_init.tcl", elf = "out/current/app.elf", hw_server_url = "tcp:127.0.0.1:3121", run_ms = 1000, ps_target_pattern = "APU", pl_target_pattern = "xc7z020*", cpu_target_pattern = "ARM Cortex-A9 MPCore #0", ps_init_commands = ["ps7_init", "ps7_post_config"] }

[stages.deploy_qspi]
kind = "deploy"
needs = ["boot", "platform"]
target = "zybo_z7_20"
toolchains = ["program_flash"]
runner = "amd.qspi.program"
destructive = true
timeout_seconds = 900
description = "在显式确认后编程指定 QSPI 区段；默认不做读回校验"
options = { boot_image = "out/current/BOOT.BIN", fsbl = "out/current/fsbl.elf", flash_type = "qspi-x4-single", offset = 0, flash_size_bytes = 16777216, target_device_name = "arm_dap", target_name_contains = "Zybo Z7-210351BFB011A", target_idcode = "4ba00477", server_url = "tcp:127.0.0.1:3121", verify = false }

[stages.deploy_qspi_release]
kind = "deploy"
needs = ["boot", "platform"]
target = "zybo_z7_20"
toolchains = ["program_flash"]
runner = "amd.qspi.program"
destructive = true
side_effects = ["persistent-storage"]
timeout_seconds = 900
description = "发布 QSPI 编程，强制执行读回校验"
options = { boot_image = "out/current/BOOT.BIN", fsbl = "out/current/fsbl.elf", flash_type = "qspi-x4-single", offset = 0, flash_size_bytes = 16777216, target_device_name = "arm_dap", target_name_contains = "Zybo Z7-210351BFB011A", target_idcode = "4ba00477", server_url = "tcp:127.0.0.1:3121", verify = true }

[stages.runtime_health]
kind = "validate"
needs = ["boot"]
target = "zybo_z7_20"
runner = "amd.uart.commands"
timeout_seconds = 90
description = "部署后的时钟、链路、DMA 与音频运行状态检查"
[stages.runtime_health.options]
prompt_regex = '>\s*$'
timeout_seconds = 4.0
idle_seconds = 0.2
line_ending = "\r\n"

[[stages.runtime_health.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "serial_seen=1", "vsync_seen=1", "mmcm_locked=1", "pixel_clk_seen=1", "errors=0x00000000", "audio_status=0x0000000[01]"]
timeout_seconds = 5.0

[[stages.runtime_health.options.steps]]
send = "status"
expect = ["miss=0", "vdma_err=0", "dma_err=0x000"]
reject = ["VDMA_ERR=[1-9]", "DMA_ERR=0x(?!000)"]
timeout_seconds = 5.0

[[stages.runtime_health.options.steps]]
send = "audio status"
expect = ["err=0", "pcm_overflow=0"]
timeout_seconds = 5.0

[stages.gameplay_audio_signal]
kind = "validate"
needs = ["runtime_health"]
target = "zybo_z7_20"
inputs = ["scripts/build/validate_capture_signal.py", "tools/board/validation.py"]
outputs = ["out/board/gameplay_audio_signal/capture.json", "out/board/gameplay_audio_signal/capture.wav"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/validate_capture_signal.py", "--rom", "0:/games/MechPlatoon.gba", "--serial", "/dev/serial/by-id/usb-Digilent_Digilent_Adept_USB_Device_210351BFB011-if01-port0"]
side_effects = ["runtime-state"]
toolchains = ["python"]
timeout_seconds = 180
success_markers = ["GAMEPLAY_AUDIO_SIGNAL_PASS"]
description = "进入游戏后用 FFmpeg 采集并确认 HDMI 音频信号"

[stages.speaker_cold_boot]
kind = "validate"
needs = ["deploy_qspi_release", "runtime_health"]
target = "zybo_z7_20"
inputs = ["scripts/build/record_cold_boot.py", "out/current/bundle.json", "out/board/cold_boot_evidence.json"]
outputs = ["out/board/speaker_cold_boot.json"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/record_cold_boot.py", "--evidence", "out/board/cold_boot_evidence.json"]
toolchains = ["python"]
timeout_seconds = 180
success_markers = ["SPEAKER_COLD_BOOT_PASS"]
options = { bundle_verification = "cold_boot_verified", bundle_evidence = "out/board/speaker_cold_boot.json" }
description = "记录 QSPI 断电冷启动、运行状态和扬声器听感证据"

[stages.board_smoke]
kind = "validate"
needs = ["deploy_jtag"]
target = "zybo_z7_20"
runner = "amd.uart.commands"
timeout_seconds = 90
success_markers = ["capture_seq_fps=", "blit_success_fps=", "cycles_missing=0->0"]
description = "UART 加载 GBA ROM，检查 DMA/VDMA 与帧率，并验证 HDMI 时钟、EDID 和链路请求"
[stages.board_smoke.options]
prompt_regex = '>\s*$'
timeout_seconds = 4.0
idle_seconds = 0.2
line_ending = "\r\n"

[[stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "pixel_clk_seen=1", "mmcm_locked=1", "errors=0x00000000"]
timeout_seconds = 5.0

# Let the PS HDMI service retry E-DDC while HPD remains high after a cold start.
[[stages.board_smoke.options.steps]]
send = "fps 3 100"
expect = ["elapsed=3000 ms", "capture_seq_fps="]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = [
  "hpd=1",
  "edid_valid=1",
  "sink=HDMI",
  "link_mode_requested=HDMI",
  "request_written=1",
  "vsdb=1",
  "cea_v3=1",
  "read_extensions=1",
]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "audio path hdmi"
expect = ["audio path request=HDMI"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "pixel_clk_seen=1", "mmcm_locked=1", "errors=0x00000000"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "audio status"
expect = ["path=HDMI", "route=idle", "requested=HDMI", "err=0"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "audio path i2s"
expect = ["audio path request=I2S"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "pixel_clk_seen=1", "mmcm_locked=1", "errors=0x00000000"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "audio status"
expect = ["path=I2S", "route=idle", "requested=I2S", "err=0"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "rom load 0:/games/MechPlatoon.gba"
expect = ["\\[CMD\\] rom load ok"]
timeout_seconds = 45.0

[[stages.board_smoke.options.steps]]
send = "status"
expect = ["miss=0", "vdma_err=0", "dma_err=0x000"]
reject = ["VDMA_ERR=[1-9]", "DMA_ERR=0x(?!000)"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "rom status"
expect = ["rom loaded=1", "bytes=8388608", "0:/games/MechPlatoon.gba"]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = [
  "pixel_reset_released=1",
  "serial_seen=1",
  "vsync_seen=1",
  "mmcm_locked=1",
  "pixel_clk_seen=1",
  "errors=0x00000000",
  "edid_valid=[01]",
  "sink=(DVI|HDMI)",
  "link_mode_requested=(DVI|HDMI)",
  "request_written=[01]",
]
timeout_seconds = 5.0

[[stages.board_smoke.options.steps]]
send = "fps 10 100"
expect = ["capture_seq_fps=", "blit_success_fps=", "cycles_missing=0->0"]
timeout_seconds = 25.0

[suites]
host = ["host_regression"]
rtl-smoke = ["rtl_project", "rtl_smoke"]
rtl-memory = ["rtl_project", "rtl_memory"]
rtl-cpu = ["rtl_project", "rtl_cpu"]
rtl-system = ["rtl_project", "rtl_system"]
rtl = ["rtl_project", "rtl_smoke", "rtl_memory", "rtl_cpu", "rtl_system"]
board-smoke = ["board_smoke"]
board-runtime = ["runtime_health", "gameplay_audio_signal"]
board-cold-boot = ["runtime_health", "speaker_cold_boot"]
