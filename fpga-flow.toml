# GBA 消费项目 profile：项目特有路径和验收规则留在本仓库。
schema_version = 1

[project]
name = "zynq-gba-mister-vivado"
description = "Zybo Z7-20 上的 Zynq-7000 GBA 项目"

[flow]
output_dir = "out/fpga-flow"
default_target = "zybo_z7_20"
max_parallel_stages = 2

[bundle]
schema_version = 3
output_dir = "out/current"

[bundle.artifacts]
bitstream = "out/fpga-flow/artifacts/bitstream.bit"
xsa = "out/fpga-flow/artifacts/hardware.xsa"
fsbl = "out/fpga-flow/artifacts/fsbl.elf"
ps7_init = "out/fpga-flow/artifacts/ps7_init.tcl"
app = "out/fpga-flow/artifacts/app.elf"
boot_bin = "out/fpga-flow/artifacts/BOOT.BIN"

[bundle.dependencies]
embedded_video_ip_repository = "../EmbeddedVideoIP"
board_profile = "zybo_z7_20"

[external_dependencies.video_pl]
path = "../EmbeddedVideoIP"
revision = "c9fe8f9076238e40083ef6af6b25259de640a0c5"
environment_variable = "EMBEDDED_VIDEO_IP_REPO"
inputs = ["VERSION", "dependencies.lock.json", "contracts/**", "ip/video_pipeline_1_0/hdl/**", "ip/video_pipeline_1_0/constraints/**", "ip_repo/if/**", "ip_repo/panfpga/embedded_video_ip/**"]
ignored_committed_paths = ["README.md", "docs/*.md"]

[external_dependencies.video_ps]
path = "../EmbeddedVideoIP"
revision = "c9fe8f9076238e40083ef6af6b25259de640a0c5"
environment_variable = "EMBEDDED_VIDEO_IP_REPO"
inputs = ["VERSION", "dependencies.lock.json", "contracts/**", "software/**", "platforms/amd_7series/**", "tools/install_ps_library.py"]
ignored_committed_paths = ["README.md", "docs/*.md"]

[toolchains.python]
command = "/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15"
version_args = ["--version"]
expected_version = "Python 3.15.2"

[toolchains.vivado]
command = "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado"
version_args = ["-version"]
expected_version = "vivado v2025.2.1"

[toolchains.vitis]
command = "/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis"
version_command = ["/usr/bin/xvfb-run", "-a", "/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis", "--version"]
expected_version = "Vitis v2025.2.1"

[toolchains.xsct]
command = "/tools/AMDDesignTools/2025.2.1/Vitis/bin/xsct"
version_command = ["/tools/AMDDesignTools/2025.2.1/Vitis/bin/xsct", "-eval", "puts [version]; exit"]
expected_version = "xsct 2025.2.1"

[toolchains.program_flash]
command = "/tools/AMDDesignTools/2025.2.1/Vitis/bin/program_flash"
version_command = ["/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis", "-version"]
expected_version = "Vitis v2025.2.1"

[targets.zybo_z7_20]
family = "amd-zynq-7000"
part = "xc7z020clg400-1"
board_part = "digilentinc.com:zybo-z7-20:part0:1.2"
hw_server_url = "tcp:127.0.0.1:3121"
flash_type = "qspi-x4-single"
flash_size_bytes = 16777216

[targets.zybo_z7_20.uart]
port = "/dev/serial/by-id/usb-Digilent_Digilent_Adept_USB_Device_210351BFB011-if01-port0"
baudrate = 115200
prompt_regex = '>\s*$'

[stages.hardware]
kind = "build"
external_inputs = ["video_pl"]
inputs = [
  "src/dfx_runtime.txt",
  "config/ps_pl_contract.json",
  "src/bd/**",
  "src/constraints/**",
  "src/rtl/**",
  "src/ps/app/src/Gba/Inc/ps_pl_contract_generated.h",
  "scripts/build/fpga_flow_artifacts.py",
  "tools/generate_hw_contract.py",
  "tools/vitis_stages.py",
  "scripts/build/bd_ip_maintenance.tcl",
  "scripts/build/build_bitstream.tcl",
  "scripts/build/enable_bitstream_compression.tcl",
  "scripts/build/embedded_video_ip_consumer.tcl",
  "scripts/build/incremental_build_cache.py",
]
outputs = [
  "out/fpga-flow/artifacts/bitstream.bit",
  "out/fpga-flow/artifacts/hardware.xsa",
  "out/fpga-flow/backend/hardware.json",
  "out/vivado/reports/timing_summary.rpt",
  "out/vivado/reports/drc.rpt",
  "out/vivado/reports/qor_gate.tsv",
]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/fpga_flow_artifacts.py", "--stage", "hardware", "--jobs", "4", "--vivado", "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado", "--vitis", "/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis"]
toolchains = ["python", "vivado"]
timeout_seconds = 21600
success_markers = ["FPGA_FLOW_ARTIFACT stage=hardware"]
description = "调用项目硬件后端构建 PL bitstream 与 XSA"

[stages.platform]
kind = "build"
needs = ["hardware"]
env = { FPGA_FLOW_VITIS_VERSION = "2025.2.1" }
inputs = [
  "src/ps/app/src/app.yaml",
  "tools/vitis_stages.py",
  "scripts/build/fpga_flow_artifacts.py",
  "scripts/fatfs/configure_utf8_lfn.py",
  "scripts/build/embedded_video_ip_consumer.tcl",
]
outputs = [
  "out/fpga-flow/artifacts/platform.xpfm",
  "out/fpga-flow/artifacts/fsbl.elf",
  "out/fpga-flow/artifacts/ps7_init.tcl",
  "out/fpga-flow/backend/platform.json",
]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/fpga_flow_artifacts.py", "--stage", "platform", "--jobs", "4", "--vitis", "/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis"]
toolchains = ["python", "vivado", "vitis"]
timeout_seconds = 14400
success_markers = ["FPGA_FLOW_ARTIFACT stage=platform"]
description = "基于当前 XSA 构建 PS platform、BSP、FSBL 与初始化脚本"

[stages.app]
kind = "build"
needs = ["platform"]
external_inputs = ["video_ps"]
inputs = [
  "src/ps/app/src/**",
  "config/ps_pl_contract.json",
  "tools/generate_hw_contract.py",
  "src/rtl/common/ps_pl_contract_generated.vh",
  "tools/vitis_stages.py",
  "scripts/build/fpga_flow_artifacts.py",
  "scripts/fatfs/configure_utf8_lfn.py",
  "scripts/build/embedded_video_ip_consumer.tcl",
]
outputs = ["out/fpga-flow/artifacts/app.elf", "out/fpga-flow/backend/app.json"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/fpga_flow_artifacts.py", "--stage", "app", "--jobs", "4", "--vitis", "/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis"]
toolchains = ["python", "vivado", "vitis"]
timeout_seconds = 7200
success_markers = ["FPGA_FLOW_ARTIFACT stage=app"]
description = "构建 PS 应用 ELF；应用改动沿用对应 XPFM 的 Ninja 缓存"

[stages.boot]
kind = "build"
needs = ["hardware", "platform", "app"]
inputs = ["tools/vitis_stages.py", "scripts/build/fpga_flow_artifacts.py"]
outputs = ["out/fpga-flow/artifacts/BOOT.BIN", "out/fpga-flow/backend/boot.json"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/fpga_flow_artifacts.py", "--stage", "boot", "--jobs", "4", "--vitis", "/tools/AMDDesignTools/2025.2.1/Vitis/bin/vitis"]
toolchains = ["python", "vivado", "vitis"]
timeout_seconds = 1800
success_markers = ["FPGA_FLOW_ARTIFACT stage=boot"]
description = "生成与当前 bitstream、FSBL 和 app ELF 匹配的启动镜像"

[stages.host_regression]
kind = "test"
inputs = ["tests/ps/**", "src/ps/app/src/**", "scripts/build/run_host_regression.py"]
outputs = ["out/test-host/unittest.log"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/run_host_regression.py"]
toolchains = ["python"]
timeout_seconds = 1800
success_markers = ["FPGA_FLOW_HOST_PASS"]
description = "运行项目 host C 回归"

[stages.rtl_project]
kind = "test"
external_inputs = ["video_pl"]
inputs = ["src/rtl/**", "src/bd/**", "src/constraints/**", "config/ps_pl_contract.json", "tools/generate_hw_contract.py", "src/ps/app/src/Gba/Inc/ps_pl_contract_generated.h", "scripts/build/rebuild_project.tcl", "scripts/build/embedded_video_ip_consumer.tcl", "scripts/build/embedded_video_ip_bd.tcl", "scripts/build/bd_ip_maintenance.tcl", "scripts/build/rtl_project.py"]
outputs = [
  "out/vivado/project/Zynq-GBA_MisTer-Vivado.xpr",
  "out/vivado/project/Zynq-GBA_MisTer-Vivado.srcs/sources_1/bd/zynq_gba_system/zynq_gba_system.bd",
]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/rtl_project.py", "--vivado", "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado"]
toolchains = ["python", "vivado"]
timeout_seconds = 7200
success_markers = ["FPGA_FLOW_RTL_PROJECT_PASS"]
description = "生成独立的 Vivado RTL 仿真工程"

[stages.rtl_smoke]
kind = "test"
needs = ["rtl_project"]
inputs = ["tests/rtl_manifest.toml", "tools/rtl_manifest.py", "tests/rtl/**", "scripts/build/run_rtl_manifest.py"]
outputs = ["out/sim/smoke/seed-1/current/*/xsim.log"]
command = ["/home/pzy/.local/share/uv/python/cpython-3.15.2-linux-x86_64-gnu/bin/python3.15", "scripts/build/run_rtl_manifest.py", "--suite", "smoke", "--seed", "1", "--jobs", "2", "--vivado", "/tools/AMDDesignTools/2025.2.1/Vivado/bin/vivado"]
toolchains = ["python", "vivado"]
