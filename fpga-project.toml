  "ip-repo/embedded-video-ip/RELEASE-METADATA.json",
  "ip-repo/embedded-video-ip/ip_repo/panfpga/embedded_video_ip/PACKAGE_METADATA.json",
  "ip-repo/embedded-video-ip/ip_repo/if/tmds_v1_0/tmds.xml",
  "ip-repo/embedded-video-ip/ip_repo/if/tmds_v1_0/tmds_rtl.xml",
  "ip-repo/embedded-video-ip-DEPENDENCY-LOCK.json",
]

[dependencies.embedded_video_ip_ps_zynq7000]
