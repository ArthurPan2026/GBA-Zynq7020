[validation.stages.runtime_health]
kind = "validate"
needs = ["boot"]
target = "zybo_z7_20"
runner = "amd.uart.commands"
timeout_seconds = 90
description = "部署后的时钟、链路、DMA 与音频运行状态检查"
[validation.stages.runtime_health.options]
prompt_regex = '(?m)^[ \t]*>[ \t]*\r?$'
require_command_echo = true
timeout_seconds = 4.0
idle_seconds = 0.2
line_ending = "\r\n"

[[validation.stages.runtime_health.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "serial_seen=1", "vsync_seen=1", "mmcm_locked=1", "pixel_clk_seen=1", "errors=0x00000000", "audio_status=0x0000000[01]"]
timeout_seconds = 5.0

[[validation.stages.runtime_health.options.steps]]
send = "status"
expect = ["miss=0", "vdma_err=0", "dma_err=0x000"]
reject = ["VDMA_ERR=[1-9]", "DMA_ERR=0x(?!000)"]
timeout_seconds = 5.0

[[validation.stages.runtime_health.options.steps]]
send = "audio status"
expect = ["err=0", "pcm_overflow=0"]
timeout_seconds = 5.0

[validation.stages.gameplay_audio_signal]
kind = "validate"
needs = ["runtime_health"]
target = "zybo_z7_20"
inputs = ["scripts/board/validate_capture_signal.py", "scripts/board/validation.py"]
outputs = ["build/fpga-flow/board/gameplay_audio_signal/capture.json", "build/fpga-flow/board/gameplay_audio_signal/capture.wav"]
command = ["python3.15", "scripts/board/validate_capture_signal.py", "--rom", "0:/games/MechPlatoon.gba"]
side_effects = ["runtime-state"]
toolchains = ["python"]
timeout_seconds = 180
success_markers = ["GAMEPLAY_AUDIO_SIGNAL_PASS"]
description = "进入游戏后用 FFmpeg 采集并确认 HDMI 音频信号"

[validation.stages.speaker_cold_boot]
kind = "validate"
needs = ["deploy_qspi_release", "runtime_health"]
target = "zybo_z7_20"
inputs = ["scripts/board/record_cold_boot.py", "build/fpga-flow/current/bundle.json", "build/fpga-flow/board/cold_boot_evidence.json"]
outputs = ["build/fpga-flow/board/speaker_cold_boot.json"]
command = ["python3.15", "scripts/board/record_cold_boot.py", "--evidence", "build/fpga-flow/board/cold_boot_evidence.json"]
toolchains = ["python"]
timeout_seconds = 180
success_markers = ["SPEAKER_COLD_BOOT_PASS"]
options = { bundle_verification = "cold_boot_verified", bundle_evidence = "build/fpga-flow/board/speaker_cold_boot.json" }
description = "记录 QSPI 断电冷启动、运行状态和扬声器听感证据"

[validation.stages.board_smoke]
kind = "validate"
needs = ["deploy_jtag"]
target = "zybo_z7_20"
runner = "amd.uart.commands"
timeout_seconds = 90
success_markers = ["capture_seq_fps=", "blit_success_fps=", "cycles_missing=0->0"]
description = "UART 加载 GBA ROM，检查 DMA/VDMA 与帧率，恢复 HDMI 音频并安全返回主菜单"
[validation.stages.board_smoke.options]
prompt_regex = '(?m)^[ \t]*>[ \t]*\r?$'
require_command_echo = true
timeout_seconds = 4.0
idle_seconds = 0.5
line_ending = "\r\n"

[[validation.stages.board_smoke.options.steps]]
send = "input detach"
expect = ["\\[CMD\\] input detached"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "input inject 00140000FF000000000000000000000000000000"
expect = ["input inject ok"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 8 100"
expect = ["elapsed=80[0-9]{2} ms"]
timeout_seconds = 15.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 3 100"
expect = ["elapsed=3[01][0-9]{2} ms"]
timeout_seconds = 10.0

[[validation.stages.board_smoke.options.steps]]
send = "rom status"
expect = ["\\[CMD\\] rom loaded=0"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "input inject 0014000000000000000000000000000000000000"
expect = ["input inject ok"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "usb portreset"
expect = ["\\[CMD\\] usb portreset ok"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "pixel_clk_seen=1", "mmcm_locked=1", "errors=0x00000000"]
timeout_seconds = 5.0

# Let the PS HDMI service retry E-DDC while HPD remains high after a cold start.
[[validation.stages.board_smoke.options.steps]]
send = "fps 3 100"
expect = ["elapsed=3[01][0-9]{2} ms", "capture_seq_fps="]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = [
  "hpd=1",
  "edid_valid=1",
  "sink=HDMI",
  "link_mode_requested=HDMI",
  "request_written=1",
  "vsdb=1",
  "cea_v3=1",
  "read_extensions=1",
]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "audio path hdmi"
expect = ["audio path request=HDMI"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "pixel_clk_seen=1", "mmcm_locked=1", "errors=0x00000000"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "audio status"
expect = ["path=HDMI", "route=idle", "requested=HDMI", "err=0"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "audio path i2s"
expect = ["audio path request=I2S"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "pixel_clk_seen=1", "mmcm_locked=1", "errors=0x00000000"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "audio status"
expect = ["path=I2S", "route=idle", "requested=I2S", "err=0"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "rom load 0:/games/MechPlatoon.gba"
expect = ["\\[CMD\\] rom load ok", "\\[ROM\\] ready bytes=8388608"]
timeout_seconds = 45.0

[[validation.stages.board_smoke.options.steps]]
send = "status"
expect = ["rom=1", "miss=0", "vdma_err=0", "dma_err=0x000"]
reject = ["VDMA_ERR=[1-9]", "DMA_ERR=0x(?!000)"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 3 100"
expect = ["elapsed=3[01][0-9]{2} ms", "capture_seq_fps="]
timeout_seconds = 10.0

[[validation.stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = [
  "pixel_reset_released=1",
  "serial_seen=1",
  "vsync_seen=1",
  "mmcm_locked=1",
  "pixel_clk_seen=1",
  "errors=0x00000000",
  "edid_valid=[01]",
  "sink=(DVI|HDMI)",
  "link_mode_requested=(DVI|HDMI)",
  "request_written=[01]",
]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 10 100"
expect = ["capture_seq_fps=", "blit_success_fps=", "cycles_missing=0->0"]
timeout_seconds = 25.0

[[validation.stages.board_smoke.options.steps]]
send = "input detach"
expect = ["\\[CMD\\] input detached"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "input inject 00140000FF000000000000000000000000000000"
expect = ["input inject ok"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 8 100"
expect = ["elapsed=80[0-9]{2} ms"]
timeout_seconds = 15.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 3 100"
expect = ["elapsed=3[01][0-9]{2} ms"]
timeout_seconds = 10.0

[[validation.stages.board_smoke.options.steps]]
send = "rom status"
expect = ["\\[CMD\\] rom loaded=0"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "input inject 0014000000000000000000000000000000000000"
expect = ["input inject ok"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "usb portreset"
expect = ["\\[CMD\\] usb portreset ok"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "audio path hdmi"
expect = ["audio path request=HDMI"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "fps 1 100"
expect = ["elapsed=10[0-9]{2} ms"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "audio status"
expect = ["path=HDMI", "route=idle", "requested=HDMI", "err=0", "pcm_overflow=0"]
timeout_seconds = 5.0

[[validation.stages.board_smoke.options.steps]]
send = "hdmi diag"
expect = ["audio_status=0x00000001", "errors=0x00000000"]
timeout_seconds = 5.0


[validation.stages.video_mode_1080p60]
kind = "validate"
needs = ["deploy_jtag"]
target = "zybo_z7_20"
runner = "amd.uart.commands"
timeout_seconds = 60
side_effects = ["runtime-state"]
description = "从主菜单请求并确认 1080p60，检查时钟、视频帧和 HDMI 状态"

[validation.stages.video_mode_1080p60.options]
prompt_regex = '(?m)^[ \t]*>[ \t]*\r?$'
require_command_echo = true
timeout_seconds = 5.0
idle_seconds = 0.2
line_ending = "\r\n"

[[validation.stages.video_mode_1080p60.options.steps]]
send = "video mode set 1080p60"
expect = ["\\[VIDEO\\] request result=0"]
timeout_seconds = 5.0

[[validation.stages.video_mode_1080p60.options.steps]]
send = "fps 3 100"
expect = ["elapsed=3000 ms", "capture_seq_fps="]
timeout_seconds = 12.0

[[validation.stages.video_mode_1080p60.options.steps]]
send = "video mode status"
expect = ["active=1080p60 confirmed=[03] pending=0 dvi_recovery=0 recovery_failed=0 error=0"]
timeout_seconds = 5.0

[[validation.stages.video_mode_1080p60.options.steps]]
send = "hdmi diag"
expect = ["pixel_reset_released=1", "serial_seen=1", "vsync_seen=1", "mmcm_locked=1", "pixel_clk_seen=1", "errors=0x00000000"]
timeout_seconds = 5.0

[[validation.stages.video_mode_1080p60.options.steps]]
send = "video mode keep"
expect = ["\\[VIDEO\\] confirmed=3 dvi_recovery=0"]
timeout_seconds = 5.0

[[validation.stages.video_mode_1080p60.options.steps]]
send = "video mode status"
expect = ["active=1080p60 confirmed=3 pending=0 dvi_recovery=0 recovery_failed=0 error=0"]
timeout_seconds = 5.0

[validation.suites]
host-regression = ["host_regression"]
rtl = ["rtl_project", "rtl_smoke", "rtl_memory", "rtl_cpu", "rtl_system"]
rtl-project = ["rtl_project"]
board-smoke = ["board_smoke"]
video-mode-1080p60 = ["video_mode_1080p60"]
board-runtime = ["runtime_health", "gameplay_audio_signal"]
board-cold-boot = ["runtime_health", "speaker_cold_boot"]

[adapters.hardware]
command = ["python3.15", "scripts/flow/fpga_flow_artifacts.py", "--stage", "hardware", "--jobs", "4", "--vivado", "vivado", "--experiment-1080p60"]
inputs = ["config/ps-pl-contract.json", "scripts/flow/fpga_flow_artifacts.py", "scripts/flow/generate_hw_contract.py", "scripts/vivado/build_bitstream.tcl", "scripts/vivado/embedded_video_ip_consumer.tcl", "src/ps/app/src/Video/Inc/video_modes.def", "scripts/vivado/embedded_video_ip_bd.tcl", "scripts/flow/incremental_build_cache.py"]
outputs = ["build/fpga-flow/artifacts/bitstream.bit", "build/fpga-flow/artifacts/hardware.xsa", "build/fpga-flow/backend/hardware.json", "build/fpga-flow/vivado/hardware/reports/timing_summary.rpt", "build/fpga-flow/vivado/hardware/reports/pulse_width.rpt", "build/fpga-flow/vivado/hardware/reports/bus_skew.rpt", "build/fpga-flow/vivado/hardware/reports/experiment_1080p60.json", "build/fpga-flow/vivado/hardware/reports/drc.rpt", "build/fpga-flow/vivado/hardware/reports/qor_gate.tsv"]
success_markers = ["FPGA_FLOW_ARTIFACT stage=hardware"]

[adapters.deploy_qspi]
options = { boot_image = "build/fpga-flow/current/BOOT.BIN", fsbl = "build/fpga-flow/current/fsbl.elf", flash_type = "w25q128jv-qspi-x4-single", offset = 0, verify = false }

[adapters.deploy_qspi_release]
options = { boot_image = "build/fpga-flow/current/BOOT.BIN", fsbl = "build/fpga-flow/current/fsbl.elf", flash_type = "w25q128jv-qspi-x4-single", offset = 0, verify = true }

[adapters.platform]
command = ["python3.15", "scripts/flow/fpga_flow_artifacts.py", "--stage", "platform", "--jobs", "4"]
inputs = ["scripts/vitis/vitis_stages.py", "scripts/flow/fpga_flow_artifacts.py", "scripts/vitis/fatfs/configure_utf8_lfn.py", "scripts/vivado/embedded_video_ip_consumer.tcl", "src/ps/app/src/Video/Inc/video_modes.def"]
outputs = ["build/fpga-flow/artifacts/platform.xpfm", "build/fpga-flow/artifacts/fsbl.elf", "build/fpga-flow/artifacts/ps7_init.tcl", "build/fpga-flow/backend/platform.json"]
success_markers = ["FPGA_FLOW_ARTIFACT stage=platform"]

[adapters.app]
command = ["python3.15", "scripts/flow/fpga_flow_artifacts.py", "--stage", "app", "--jobs", "4"]
inputs = ["config/ps-pl-contract.json", "src/generated/ps/ps_pl_contract_generated.h", "scripts/flow/generate_hw_contract.py", "src/generated/rtl/ps_pl_contract_generated.vh", "scripts/vitis/vitis_stages.py", "scripts/flow/fpga_flow_artifacts.py", "scripts/vitis/fatfs/configure_utf8_lfn.py", "scripts/vivado/embedded_video_ip_consumer.tcl", "src/ps/app/src/Video/Inc/video_modes.def"]
outputs = ["build/fpga-flow/artifacts/app.elf", "build/fpga-flow/backend/app.json"]
success_markers = ["FPGA_FLOW_ARTIFACT stage=app"]

[adapters.boot]
command = ["python3.15", "scripts/flow/fpga_flow_artifacts.py", "--stage", "boot", "--jobs", "4"]
inputs = ["scripts/vitis/vitis_stages.py", "scripts/flow/fpga_flow_artifacts.py"]
outputs = ["build/fpga-flow/artifacts/BOOT.BIN", "build/fpga-flow/backend/boot.json"]
success_markers = ["FPGA_FLOW_ARTIFACT stage=boot"]

[adapters.host_regression]
command = ["python3.15", "scripts/flow/run_host_regression.py"]
inputs = ["tests/host/ps/**", "src/ps/app/**", "scripts/flow/run_host_regression.py"]
outputs = ["build/fpga-flow/tests/host/unittest.log"]
success_markers = ["FPGA_FLOW_HOST_PASS"]

[adapters.rtl_project]
