schema_version = 1

[project]
id = "gba-zynq7020"
name = "GBA-Zynq7020"
profile = "zynq7000-vitis"

[tools]
vivado_version = "2025.2.1"
vitis_version = "2025.2.1"

[board]
id = "zybo_z7_20"
family = "amd-zynq-7000"
part = "xc7z020clg400-1"
board_part = "digilentinc.com:zybo-z7-20:part0:1.2"
flash_type = "qspi-x4-single"
flash_size_bytes = 16777216
target_device_name = "arm_dap"
target_idcode = "4ba00477"
pl_target_pattern = "xc7z020*"

[vivado]
project = "vivado/gba-zynq7020.xpr"

[vitis]
app_config = "src/ps/app/src/app.yaml"
source_roots = ["src/ps/app/src"]

[dependencies.embedded_video_ip_hardware]
